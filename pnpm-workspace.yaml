# pnpm 11 reads settings from THIS file, not package.json's `pnpm` field.
# The overrides below are the ones the lockfile was resolved under — losing
# this file silently drops them and pulls real react-native into an app that
# renders on @hanzogui/react-native-web-lite.
# pnpm 11 no longer reads .npmrc's shamefully-hoist; declare it here or katex
# (and every other transitively-reached asset) stops resolving from libs/.
shamefullyHoist: true

# The repo installs ONCE at the root; apps/* are packages of that install.
# Declaring them makes `pnpm run` inside apps/hanzo-desktop see the root
# `node_modules/.bin` — without this file only `npm run` did, so the same script
# worked under one package manager and failed under the other.
#
# libs/* are deliberately NOT listed: they are compiled from source through the
# `@hanzo/desktop-*` tsconfig `paths` mapping, never installed as packages, and
# listing them makes pnpm try to fetch their unpublished names from the registry.
packages:
  - apps/*
overrides:
  '@noble/hashes': '1.8.0'
  'zod': '^4.5.2'
  react-reconciler: '^0.33.0'
  ink: '^7.1.1'
  '@radix-ui/react-primitive': '^2.1.10'
  refractor>prismjs: 1.30.0
  # Tracks the direct @hanzogui/react-native-web-lite dependency. A stale major
  # here is the dual-copy footgun the 8.x convergence exists to kill: the
  # override feeds every transitive `react-native`, the direct dep feeds ours.
  react-native: npm:@hanzogui/react-native-web-lite@^8.0.0

  # Security floors, one per MAJOR that is actually installed — a blanket
  # `minimatch: >=10` would drag every package pinned at ^3 onto a different
  # API. Derived from the Dependabot advisories' own per-major ranges; a line
  # goes when its advisory does.
  'ajv@8': '>=8.18.0'
  'brace-expansion@1': '>=1.1.16'
  'brace-expansion@2': '>=2.1.2'
  brace-expansion: '>=5.0.7'
  'dompurify@3': '>=3.4.13'
  'esbuild@0': '>=0.28.1'
  'fast-uri@3': '>=3.1.5'
  'fast-xml-parser@5': '>=5.10.1'
  'form-data@4': '>=4.0.6'
  'ip-address@10': '>=10.3.1'
  'js-yaml@3': '>=3.15.1'
  js-yaml: '4.1.1'
  'lodash@4': '>=4.18.0'
  'lodash-es@4': '>=4.18.0'
  'mermaid@11': '>=11.16.1'
  'minimatch@10': '>=10.2.3'
  'nanoid@3': '>=3.3.18'
  'piscina@4': '>=4.9.3'
  'postcss@8': '>=8.5.23'
  'protocol-buffers-schema@3': '>=3.6.1'
  'react-router@7': '>=7.18.2'
  'rollup@4': '>=4.59.0'
  'sharp@0': '>=0.35.0'
  'tar@7': '>=7.5.18'
  'tmp@0': '>=0.2.6'
  'ts-deepmerge@8': '>=8.0.0'
  'undici@6': '>=6.28.0'
  undici: '>=7.29.0'
  uuid: '>=11.1.1'
  serialize-javascript: '>=7.0.5'
  'yaml@2': '>=2.8.3'
allowBuilds:
  '@swc/core': true
  cypress: false
  edgedriver: false
  es5-ext: false
  esbuild: true
  geckodriver: false
  sharp: true
  unrs-resolver: true
