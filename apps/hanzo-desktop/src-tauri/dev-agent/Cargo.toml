[package]
name = "hanzo-dev-agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "Finds Hanzo Dev on this computer, or names the release to fetch, checks it and unpacks it"
license = "Apache-2.0"

[dependencies]
flate2 = "1.1"
hex = "0.4"
sha2 = "0.10"
tar = "0.4"
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
