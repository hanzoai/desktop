[package]
name = "hanzo-desktop"
version = "0.0.0"
description = "A first class Desktop application to interact with Hanzo Node"
authors = ["nico@dcspark.io"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
tauri = { version = "2.4", features = [ "macos-private-api", "tray-icon", "image-png", "devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# fix this dependency later on
reqwest = { version = "0.11", features = ["json", "stream"] }
lazy_static = "1.4.0"
tokio = { version = "1.36.0", features = ["macros"] }
chrono = "0.4.38"
futures-util = "0.3"
regex = "1.10.4"
once_cell = "1.19.0"
wgpu = "0.20.0"
sysinfo = "0.30.12"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
blake3 = "1.5.1"
opener = "0.7.2"
hex = "0.4.3"
base64 = "0.22.1"
time = "^0.3.36"
listeners = "0.2"
log = "0.4"
anyhow = "1.0.89"
uuid = "1.10.0"
kill_tree = { version = "0.2", features = ["tokio"] }
semver = "1.0"
sha2 = "0.10"

# Embedded inference engine (in-process mistralrs / hanzo-engine). Used by the
# `embedded_engine` module to run chat + embeddings without spawning an external
# `mistralrs-server`. Path deps point at the local hanzo-engine checkout (the
# same checkout the external `mistralrs-server` binary is built from; cf.
# HANZO_ENGINE_BIN default `/home/z/src/hanzo/engine/target/release/...`).
# Absolute paths so the dep resolves identically from the live checkout and any
# git worktree (relative depth differs between them). default-features = false
# so device backends are selected explicitly via this crate's features below.
mistralrs = { path = "/home/z/src/hanzo/engine/mistralrs", default-features = false }
mistralrs-core = { path = "/home/z/src/hanzo/engine/mistralrs-core", default-features = false }
# HTTP server for the embedded engine's OpenAI-compatible surface. Matches the
# axum version used by the engine workspace (0.8.x).
axum = { version = "0.8", features = ["json", "tokio"] }

tauri-plugin-global-shortcut = "2.3"
tauri-plugin-shell = "2.3"
tauri-plugin-single-instance = { version = "2.3", features = ["deep-link"] }
tauri-plugin-updater = "2.9"  
tauri-plugin-dialog = "2.3"
tauri-plugin-fs ="2.2"
tauri-plugin-os = "2.2"
tauri-plugin-process = "2.3"
tauri-plugin-log = "2.6"
tauri-plugin-deep-link = "2.2.0"
tauri-plugin-opener = "2.5"
tauri-plugin-notification = "2.3"
tauri-plugin-http = "2.5"

fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }

[features]
# DEFAULT: enable CUDA for the embedded engine. The live target is the DGX Spark
# (GB10, sm_121); the engine build script auto-detects the compute capability via
# nvidia-smi. macOS/CPU builds should override with `--no-default-features` and add
# the desired features, e.g. `--features metal` or `--features custom-protocol`.
default = ["cuda"]

# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# Embedded engine device backends. These forward to the mistralrs crate and also
# gate the desktop's own device-detection (`#[cfg(feature = "cuda")]` etc. in
# embedded_engine/engine.rs).
# NVIDIA CUDA GPU support (Linux/Windows; GB10 on the Spark).
cuda = ["mistralrs/cuda", "mistralrs-core/cuda"]
# cuDNN acceleration (requires cuda).
cudnn = ["cuda", "mistralrs/cudnn", "mistralrs-core/cudnn"]
# Apple Metal GPU support (macOS/Apple Silicon).
metal = ["mistralrs/metal", "mistralrs-core/metal"]
# Flash Attention 2 kernels (requires cuda).
flash-attn = ["cuda", "mistralrs/flash-attn"]
