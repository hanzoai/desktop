[package]
name = "hanzo-desktop"
version = "1.1.67"
description = "A first class Desktop application to interact with Hanzo Node"
authors = ["Hanzo AI, Inc. <dev@hanzo.ai>"]
license = "Apache-2.0"
repository = "https://github.com/hanzoai/desktop"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [ "macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# fix this dependency later on
reqwest = { version = "0.11", features = ["json", "stream"] }
mdns-sd = "0.20.1"
tokio = { version = "1.36.0", features = ["macros", "rt-multi-thread", "rt", "net", "sync", "io-util", "time"] }
chrono = "0.4.38"
futures-util = "0.3"
regex = "1.10.4"
once_cell = "1.19.0"
wgpu = "0.20.0"
sysinfo = "0.30.12"
blake3 = "1.5.1"
opener = "0.7.2"
hex = "0.4.3"
base64 = "0.22.1"
toml_edit = "0.25"
time = "^0.3.36"
log = "0.4"
# Scrubs key material and credentials out of every log record (and the log
# files older builds left on disk). See log-redact/src/lib.rs.
hanzo-log-redact = { path = "log-redact" }
# Finds a local hanzo-server, or says there is none (cloud#760). See engine-bin/src/lib.rs.
hanzo-engine-bin = { path = "engine-bin" }
# Finds Hanzo Dev, or names the release the app fetches so a local run needs no terminal. See dev-agent/src/lib.rs.
hanzo-dev-agent = { path = "dev-agent" }
# The project folders Auto can pick from. See projects/src/lib.rs.
hanzo-projects = { path = "projects" }
uuid = { version = "1.10.0", features = ["v4"] }
rand = "0.8"
# OS keychain intentionally not linked: session lives in `~/.hanzo/` (identity.rs) and secrets in Cloud KMS.

bytes = "1"
thiserror = "1.0"
dirs = "6.0"


tauri-plugin-global-shortcut = "2.3"
tauri-plugin-shell = "2.3"
tauri-plugin-single-instance = { version = "2.4", features = ["deep-link"] }
tauri-plugin-updater = "2.10"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-os = "2.3"
tauri-plugin-process = "2.3"
tauri-plugin-log = "~2.9"
tauri-plugin-deep-link = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-notification = "2.3"
tauri-plugin-http = "2.5"

# Phase 1 AI mining — native-Rust precompile (`mining/precompile.rs`), a pure
# port of lux/precompile/ai/ai_mining.go. No Go FFI / libluxprecompile shared
# library: the crypto is FIPS 204 ML-DSA (`fips204`) + BLAKE3 (`blake3`), so
# hanzo mines with no Go build chain and is identical on every platform.
fips204 = "0.4"

fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }

# SIGTERM for the served engine (local_models.rs), so it stops cleanly.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# The ZAP router (commands/browser.rs): Desktop embeds it, as every hanzo-mcp
# does, and reaches the user's browser through the Hanzo extension. A tag, not
# crates.io: crates.io stops at 1.1.2, before the extension could join the door
# without pairing (1.1.4) and before the door took 9998 (1.1.5).
zapd = { git = "https://github.com/zap-proto/zapd", tag = "v1.1.5" }

# WebKitGTK denies `getUserMedia` unless the app answers its permission-request
# signal (windows/microphone.rs). Pinned to what tauri-runtime-wry links, so
# cargo unifies on one binding rather than two views of the same C library.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0", features = ["v2_40"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# Inspect Element: a dev build's alone (`pnpm tauri:dev`); a release window has none.
devtools = ["tauri/devtools"]


