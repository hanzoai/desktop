# hanzoai/desktop — the Hanzo Desktop app (Tauri shell + React front end, pnpm
# workspace: apps/hanzo-desktop plus the libs/ packages it composes).
#
# Gate only. The shipped artifact here is a signed per-platform desktop bundle
# cut by the release lane, not a container, so there is no `images:` and nothing
# to deploy.
#
# `pnpm typecheck` (tsc --noEmit against the app's own tsconfig.app.json) is the
# real gate for this tree: the app is TypeScript end to end and its libs are
# consumed as source through the workspace, so a break in libs/hanzo-ui or
# libs/hanzo-message-ts surfaces here rather than in whoever imports it next.
# The install runs its scripts on purpose — postinstall applies the
# vite-plugin-wasm patch and the libsodium-sumo symlink, and a tree without them
# is not the tree that gets built.
test:
  # ONE number, ONE place, never behind what shipped.
  #
  # This repo declares its version by hand — there is no image and no builder to
  # derive it from, so the human writes it and the tag must then match. That gate
  # existed: `.github/workflows/release-prod.yml` failed a release whose tag and
  # package.json disagreed. It was deleted with the rest of GitHub CI on
  # 2026-07-27 and never re-homed, so since then nothing has asserted it.
  #
  # It also holds the file to being the ONLY declaration: tauri.conf.json must
  # keep POINTING at it rather than restating a number, Cargo.toml must repeat
  # it exactly (src-tauri/build.rs refuses a build where they differ), and
  # apps/hanzo-desktop/package.json must declare none (it carried a second copy
  # that agreed only by luck). Each is a place a bundle could come to report a
  # version this repo never released.
  - name: version-drift
    run: |
      set -e
      git fetch --tags --force --quiet || true
      scripts/version.sh check
  - name: typecheck
    run: |
      set -e
      pnpm install --frozen-lockfile
      pnpm typecheck
  # The log sink's redaction (Cargo.toml-guarded Rust provision in the
  # reusable workflow puts cargo on the runner). Pure Rust, no Tauri or system
  # libraries, so it runs on any runner in seconds.
  - name: log-redact
    run: |
      set -e
      cargo test --locked --manifest-path apps/hanzo-desktop/src-tauri/log-redact/Cargo.toml
  # One-time replacement of the local node's localhost HTTPS certificate
  # (node_storage/.secret, kept 0600). Pure Rust, like log-redact.
  - name: node-secret
    run: |
      set -e
      cargo test --locked --manifest-path apps/hanzo-desktop/src-tauri/node-secret/Cargo.toml
  # Which local hanzo-server the app may spawn, or none (cloud#760: release
  # bundles ship no engine, and spawning the bare name logged two errors on
  # every start). Pure Rust, no dependencies.
  - name: engine-bin
    run: |
      set -e
      cargo test --locked --manifest-path apps/hanzo-desktop/src-tauri/engine-bin/Cargo.toml
  # Hanzo Dev on this computer: where the app finds it, the release it fetches
  # when there is none, the checksum it checks, the binary it unpacks, and how a
  # run's answer is told from its log. Pure Rust, no Tauri or system libraries.
  - name: dev-agent
    run: |
      set -e
      cargo test --locked --manifest-path apps/hanzo-desktop/src-tauri/dev-agent/Cargo.toml
  # The env hanzo-node is spawned with for embeddings (cloud#760): the
  # signed-in Hanzo key as EMBEDDINGS_SERVER_API_KEY, sent only to api.hanzo.ai
  # and only to a node (v1.19.4+, per src-tauri/pins) that embeds over /v1;
  # signed in, signed out, sign-in later, and when a new key restarts the node.
  # Pure Rust.
  - name: node-env
    run: |
      set -e
      cargo test --locked --manifest-path apps/hanzo-desktop/src-tauri/node-env/Cargo.toml
  # The project folders Auto can pick from (Documents, work, code, ...). Pure Rust.
  - name: projects
    run: |
      set -e
      cargo test --locked --manifest-path apps/hanzo-desktop/src-tauri/projects/Cargo.toml
  # No secret-bearing value may be printed or logged from the Tauri crate:
  # whole-call (multiline) scan plus Debug-format of credential-like values.
  # The self-test proves the scanner still catches the shapes it must.
  - name: no-secret-logging
    run: |
      set -e
      python3 scripts/test_check_secret_logging.py
      python3 scripts/check-secret-logging.py apps/hanzo-desktop/src-tauri
