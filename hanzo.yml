# hanzoai/desktop: Open-source Hanzo Desktop SDK, reusable React + Tauri
# components, pure-Rust desktop utility crates, and starter examples.
test:
  - name: typecheck-test-and-build
    run: |
      set -e
      pnpm install --frozen-lockfile
      pnpm typecheck
      pnpm test
      pnpm build
  - name: rust-crates
    run: |
      set -e
      cargo test --workspace --locked
  - name: windows-cross-check
    run: |
      set -e
      rustup target add x86_64-pc-windows-msvc
      for crate in log-redact engine-bin projects shortcut-action; do
        cargo check --manifest-path crates/$crate/Cargo.toml --target x86_64-pc-windows-msvc --tests
      done
  - name: no-secret-logging
    run: |
      set -e
      python3 scripts/test_check_secret_logging.py
      python3 scripts/check-secret-logging.py crates examples/minimal-chat-desktop/src-tauri
