[package]
name = "desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Every platform's own credential store, each feature naming a dependency that
# exists only on its target — so one line links the right one everywhere and
# none of them is a fallback for another.
keyring = { version = "3.6", features = [
    "apple-native",
    "crypto-rust",
    "sync-secret-service",
    "windows-native",
] }
# Health is an HTTP question and every service answers it on the loopback, so
# no TLS is linked.
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
# `generate_context!` expands to code that names it.
serde_json = "1"
tokio = { version = "1", features = ["time"] }
