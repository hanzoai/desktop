# The macOS half of the desktop release lane, kept apart from desktop-release.yml so
# that macOS builds never hold back Linux and Windows. It builds aarch64, x64, and
# universal .dmg installers plus the universal .app.tar.gz updater archive on
# GitHub-hosted macos-15 (Apple Silicon) runners, attaches them to the same release,
# and recomputes SHA256SUMS and latest.json so the updater gains the darwin platforms.
#
# The host provides Xcode's command line tools; everything else this fetches. The
# app is ad-hoc signed and not notarized, so Gatekeeper asks the first time.
name: desktop-release-macos

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-macos-${{ github.ref }}
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ github.token }}
  KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
  KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}

jobs:
  meta:
    runs-on: linux-amd64
    concurrency:
      group: desktop-release-draft-${{ github.ref_name }}
      cancel-in-progress: false
    outputs:
      mode: ${{ steps.meta.outputs.mode }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: scripts/release/meta.sh

  macos:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            rust_targets: aarch64-apple-darwin
            tauri_target: aarch64-apple-darwin
          - arch: x64
            rust_targets: x86_64-apple-darwin
            tauri_target: x86_64-apple-darwin
          - arch: universal
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            tauri_target: universal-apple-darwin
    runs-on: macos-15
    timeout-minutes: 170
    env:
      V: ${{ needs.meta.outputs.version }}
      NODE_OPTIONS: --max_old_space_size=8192
      # '-' is the ad-hoc identity: Apple Silicon will not run an unsigned binary.
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain and workspace
        run: scripts/release/prepare.sh ${{ matrix.rust_targets }}

      - name: Signing key
        run: scripts/release/signing.sh ${{ needs.meta.outputs.mode }}

      - name: Build
        working-directory: apps/hanzo-desktop
        run: pnpm exec tauri build --ci --target "${{ matrix.tauri_target }}" --bundles app,dmg

      - name: Name the bundles
        run: |
          set -euo pipefail
          b=apps/hanzo-desktop/src-tauri/target/${{ matrix.tauri_target }}/release/bundle
          scripts/release/stage.sh "$b/dmg/*.dmg" "dist/Hanzo_Desktop_${V}_${{ matrix.arch }}.dmg"
          rm -f "dist/Hanzo_Desktop_${V}_${{ matrix.arch }}.dmg.sig"
          if [ "${{ matrix.arch }}" = "universal" ]; then
            scripts/release/stage.sh "$b/macos/*.app.tar.gz" "dist/Hanzo_Desktop_${V}_universal.app.tar.gz"
            test -f "dist/Hanzo_Desktop_${V}_universal.app.tar.gz.sig"
          fi
          ls -l dist

      - name: Signatures verify against the key the app ships with
        if: matrix.arch == 'universal'
        run: python3 -I scripts/release/verify.py "$UPDATER_CONF" "dist/Hanzo_Desktop_${V}_universal.app.tar.gz"

      - name: Upload
        run: |
          set -euo pipefail
          . scripts/release/gh.sh
          for f in dist/*; do asset_put "${{ needs.meta.outputs.release }}" "$f"; done

  manifest:
    needs: [meta, macos]
    runs-on: linux-amd64
    concurrency:
      group: desktop-release-manifest-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: SHA256SUMS and latest.json
        run: scripts/release/manifest.sh "${{ needs.meta.outputs.release }}" "${{ needs.meta.outputs.tag }}" "${{ needs.meta.outputs.version }}"
      - name: Delete a dry run's draft release
        if: needs.meta.outputs.mode == 'dry-run'
        run: |
          . scripts/release/gh.sh
          release_delete "${{ needs.meta.outputs.release }}"
