name: probe-proot
on:
  push:
    branches: [probe-proot]
jobs:
  p:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: linux-${{ matrix.arch }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: sysroot
        run: >-
          scripts/release/sysroot.sh -b "$RUNNER_TEMP/sysroot"
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          libasound2-dev libsoup-3.0-dev libxdo-dev xdg-utils patchelf desktop-file-utils
          squashfs-tools file zsync
      - name: overlay
        run: |
          set -x
          t=$(gcc -dumpmachine)
          ls -l "$RUNNER_TEMP/sysroot/usr/bin/xdg-mime" "$RUNNER_TEMP/sysroot/usr/bin/xdg-open" || true
          ls "$RUNNER_TEMP/sysroot/usr/lib/$t/webkit2gtk-4.1/" || true
          test ! -e /usr/bin/xdg-mime && echo "xdg-mime absent outside"
          unshare -Urm scripts/release/overlay.sh "$RUNNER_TEMP/sysroot" bash -c '
            id
            ls -l /usr/bin/xdg-mime /usr/bin/xdg-open
            ls /usr/lib/'"$t"'/webkit2gtk-4.1/
            ls /usr/bin | wc -l; ls /usr/lib/'"$t"' | wc -l
            gcc --version | head -1; ldd /usr/bin/ls | head -2; node -v; cp /usr/bin/xdg-mime /tmp/copied-xdg-mime && echo copy-ok
            ls /usr/lib/'"$t"'/libc.so.6 /usr/lib/'"$t"'/libgtk-3.so'
          echo "overlay rc=$?"
          test ! -e /usr/bin/xdg-mime && echo "xdg-mime still absent outside"
