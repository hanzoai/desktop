name: probe
on:
  push:
    branches: [release-lane]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        label: [heavy-linux-amd64, heavy-linux-arm64]
    runs-on: ${{ matrix.label }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: |
          set -x
          id; uname -a; nproc; free -g; df -h / /tmp "$RUNNER_TEMP" "$HOME" || true
          cat /etc/os-release | head -3
          sudo -n true 2>&1 | head -1 || true
          for c in rustup cargo rustc gh zip unzip makensis clang clang-cl lld lld-link llvm-ar rpmbuild fakeroot patchelf file wget xz curl jq node pnpm corepack python3 uv java git dpkg-deb nasm cmake ninja pkg-config; do printf '%-12s %s\n' "$c" "$(command -v $c || echo -)"; done
          node -v; pnpm -v || true
          dpkg -l | awk '/^ii/{print $2}' | grep -E 'webkit|gtk|soup|nsis|appindicator|rsvg|asound|fuse|squashfs|desktop-file|xdg-utils|llvm|clang|lld|libssl|build-essential|binutils' | tr '\n' ' '
      - name: Network
        run: |
          for u in \
            https://download.hanzo.ai/hanzo-node/binaries/production/x86_64-unknown-linux-gnu/v1.15.0.zip \
            https://download.hanzo.ai/llm-models/embeddinggemma-300M-BF16.gguf \
            https://index.crates.io/config.json https://static.crates.io/crates/serde/serde-1.0.0.crate \
            https://static.rust-lang.org/dist/channel-rust-stable.toml https://sh.rustup.rs \
            https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage \
            https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll \
            https://github.com/rust-cross/cargo-xwin/releases/latest \
            https://aka.ms/vs/17/release/channel https://download.visualstudio.microsoft.com/ \
            https://archive.ubuntu.com/ubuntu/dists/noble/InRelease https://ports.ubuntu.com/ubuntu-ports/dists/noble/InRelease \
            https://kms.hanzo.ai/v1/kms/health https://api.github.com/rate_limit ; do
            printf '%s ' "$u"; curl -s -o /dev/null -L -r 0-0 -m 20 -w '%{http_code} %{time_total}s\n' "$u" || echo FAIL
          done
      - name: apt closure as non-root
        run: |
          set -eu
          D="$RUNNER_TEMP/apt"; mkdir -p "$D/lists/partial" "$D/archives/partial"
          apt=(apt-get -o Dir::State="$D" -o Dir::State::lists="$D/lists" -o Dir::Cache="$D" -o Dir::Cache::archives="$D/archives" -o Dir::State::status=/var/lib/dpkg/status -o Debug::NoLocking=1 -o APT::Sandbox::User=)
          time "${apt[@]}" update -qq 2>&1 | tail -5
          time "${apt[@]}" install --download-only -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libsoup-3.0-dev patchelf nsis lld llvm clang 2>&1 | tail -15
          ls "$D/archives" | wc -l; du -sh "$D/archives"
