# The Hanzo Desktop release lane: a v* tag builds Linux (amd64, arm64) and Windows
# bundles on the cluster runners, signs the updater bundles with the key in Hanzo
# KMS, and publishes them to the GitHub release for the tag with SHA256SUMS and the
# Tauri updater's latest.json. macOS is desktop-release-macos.yml, on a host of its
# own, so a missing Mac never holds this back.
#
#   tag push v<version>        release. The tag must equal package.json's version.
#   pull request touching the  dry run: the same builds and uploads, against a draft
#   lane, or Run workflow on   release nobody can see, deleted by the last job.
#   a branch
#   Run workflow on a tag      cuts that tag's release again.
#
# Runners are ephemeral pods with no sudo and no apt, so the Linux build libraries
# are unpacked into a prefix under the job (scripts/release/sysroot.sh). heavy-* is
# the platform's class for a job that wants all six cores. Bundles are unsigned for
# the OS; the updater signature is the only one.
name: desktop-release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/desktop-release.yml
      - scripts/release/**
      - apps/hanzo-desktop/src-tauri/tauri.conf.json
      - apps/hanzo-desktop/src-tauri/download-binaries.sh
      - apps/hanzo-desktop/src-tauri/pins
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITHUB_TOKEN: ${{ github.token }}
  KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
  KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}

jobs:
  meta:
    # A fork's pull request holds no secrets and a read-only token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: linux-amd64
    # Two workflows may reach for the same release at once; one creates it.
    concurrency:
      group: desktop-release-draft-${{ github.ref_name }}
      cancel-in-progress: false
    outputs:
      mode: ${{ steps.meta.outputs.mode }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/release/meta.sh

  linux:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, rpm: x86_64 }
          - { arch: arm64, rpm: aarch64 }
    runs-on: heavy-linux-${{ matrix.arch }}
    timeout-minutes: 170
    env:
      V: ${{ needs.meta.outputs.version }}
      # linuxdeploy and the AppImage runtime are AppImages themselves and need FUSE
      # to mount; the sandbox has none, so they run extracted.
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NODE_OPTIONS: --max_old_space_size=8192
    steps:
      - uses: actions/checkout@v4

      - name: Build libraries
        run: >-
          scripts/release/sysroot.sh -b "$RUNNER_TEMP/sysroot"
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          libasound2-dev libsoup-3.0-dev libxdo-dev xdg-utils patchelf desktop-file-utils
          squashfs-tools file zsync

      - name: Toolchain and workspace
        run: scripts/release/prepare.sh

      - name: Sidecars and model
        run: apps/hanzo-desktop/src-tauri/download-binaries.sh

      - name: Signing key
        run: scripts/release/signing.sh ${{ needs.meta.outputs.mode }}

      - name: Build
        working-directory: apps/hanzo-desktop
        run: pnpm exec tauri build --ci --bundles appimage,deb,rpm

      - name: Name the bundles
        run: |
          set -euo pipefail
          b=apps/hanzo-desktop/src-tauri/target/release/bundle
          scripts/release/stage.sh "$b/appimage/*.AppImage" "dist/Hanzo_Desktop_${V}_${{ matrix.arch }}.AppImage"
          scripts/release/stage.sh "$b/deb/*.deb" "dist/Hanzo_Desktop_${V}_${{ matrix.arch }}.deb"
          scripts/release/stage.sh "$b/rpm/*.rpm" "dist/Hanzo_Desktop-${V}-1.${{ matrix.rpm }}.rpm"
          test -f "dist/Hanzo_Desktop_${V}_${{ matrix.arch }}.AppImage.sig"
          ls -l dist

      - name: Signatures verify against the key the app ships with
        run: |
          set -euo pipefail
          signed=(); for f in dist/*; do case $f in *.sig) ;; *) [ ! -f "$f.sig" ] || signed+=("$f") ;; esac; done
          python3 -I scripts/release/verify.py "$UPDATER_CONF" "${signed[@]}"

      - name: Upload
        run: |
          set -euo pipefail
          . scripts/release/gh.sh
          for f in dist/*; do asset_put "${{ needs.meta.outputs.release }}" "$f"; done

  windows:
    needs: meta
    # Cross-built: Tauri's NSIS bundler runs makensis and cargo-xwin compiles for
    # x86_64-pc-windows-msvc against the Windows SDK it fetches from Microsoft, so no
    # Windows host is needed. Only amd64 has the toolchain this uses.
    runs-on: heavy-linux-amd64
    timeout-minutes: 170
    env:
      V: ${{ needs.meta.outputs.version }}
      TRIPLE: x86_64-pc-windows-msvc
      NODE_OPTIONS: --max_old_space_size=8192
      XWIN_ACCEPT_LICENSE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Cross toolchain
        run: |
          set -euo pipefail
          scripts/release/sysroot.sh "$RUNNER_TEMP/sysroot" nsis lld llvm clang
          llvm=$RUNNER_TEMP/sysroot/usr/lib/llvm-18
          ln -sf clang "$llvm/bin/clang-cl"
          echo "$llvm/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$llvm/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          xwin=v0.23.1
          url=https://github.com/rust-cross/cargo-xwin/releases/download/$xwin/cargo-xwin-$xwin.x86_64-unknown-linux-musl.tar.gz
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/xwin.tgz" "$url"
          echo "$(curl -fsSL "$url.sha256" | cut -d' ' -f1)  $RUNNER_TEMP/xwin.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/xwin.tgz" -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Toolchain and workspace
        run: scripts/release/prepare.sh "$TRIPLE"

      - name: Sidecars and model
        env:
          TARGET: ${{ env.TRIPLE }}
        run: apps/hanzo-desktop/src-tauri/download-binaries.sh

      - name: Signing key
        run: scripts/release/signing.sh ${{ needs.meta.outputs.mode }}

      - name: Build
        working-directory: apps/hanzo-desktop
        run: pnpm exec tauri build --ci --runner cargo-xwin --target "$TRIPLE" --bundles nsis

      - name: Name the bundles
        run: |
          set -euo pipefail
          t=apps/hanzo-desktop/src-tauri
          scripts/release/stage.sh "$t/target/$TRIPLE/release/bundle/nsis/*-setup.exe" "dist/Hanzo_Desktop_${V}_x64-setup.exe"
          test -f "dist/Hanzo_Desktop_${V}_x64-setup.exe.sig"

          # The portable build is the install tree: the app, the three sidecars
          # beside it under the names Tauri gives them on install, and the model.
          p="$RUNNER_TEMP/portable/Hanzo Desktop"
          mkdir -p "$p"
          cp "$t/target/$TRIPLE/release/hanzo-desktop.exe" "$p/Hanzo Desktop.exe"
          n=$t/external-binaries/hanzo-node
          cp "$n/hanzo-node-$TRIPLE.exe" "$p/hanzo-node.exe"
          cp "$n/hanzo-tools-runner-resources/deno-$TRIPLE.exe" "$p/deno.exe"
          cp "$n/hanzo-tools-runner-resources/uv-$TRIPLE.exe" "$p/uv.exe"
          cp -r "$t/llm-models" "$p/llm-models"
          (cd "$RUNNER_TEMP/portable" && zip -qr -X -1 "$OLDPWD/dist/Hanzo_Desktop_${V}_x64-portable.zip" "Hanzo Desktop")
          ls -l dist

      - name: Signatures verify against the key the app ships with
        run: python3 -I scripts/release/verify.py "$UPDATER_CONF" "dist/Hanzo_Desktop_${V}_x64-setup.exe"

      - name: Upload
        run: |
          set -euo pipefail
          . scripts/release/gh.sh
          for f in dist/*; do asset_put "${{ needs.meta.outputs.release }}" "$f"; done

  release:
    needs: [meta, linux, windows]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.windows.result == 'success' }}
    runs-on: linux-amd64
    # The manifest is computed from the release, so two writers take turns.
    concurrency:
      group: desktop-release-manifest-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      V: ${{ needs.meta.outputs.version }}
      ID: ${{ needs.meta.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Every bundle this lane makes is on the release
        run: |
          set -euo pipefail
          . scripts/release/gh.sh
          have=$(release_assets "$ID" | jq -r '.[].name')
          missing=0
          for n in "Hanzo_Desktop_${V}_amd64.AppImage" "Hanzo_Desktop_${V}_amd64.AppImage.sig" \
                   "Hanzo_Desktop_${V}_arm64.AppImage" "Hanzo_Desktop_${V}_arm64.AppImage.sig" \
                   "Hanzo_Desktop_${V}_amd64.deb" "Hanzo_Desktop_${V}_arm64.deb" \
                   "Hanzo_Desktop-${V}-1.x86_64.rpm" "Hanzo_Desktop-${V}-1.aarch64.rpm" \
                   "Hanzo_Desktop_${V}_x64-setup.exe" "Hanzo_Desktop_${V}_x64-setup.exe.sig" \
                   "Hanzo_Desktop_${V}_x64-portable.zip"; do
            grep -qxF "$n" <<<"$have" || { echo "::error::$n is not on the release"; missing=1; }
          done
          exit $missing

      - name: SHA256SUMS and latest.json
        run: scripts/release/manifest.sh "$ID" "${{ needs.meta.outputs.tag }}" "$V"

      - name: Publish
        if: needs.meta.outputs.mode == 'release'
        run: |
          . scripts/release/gh.sh
          release_publish "$ID" "${{ needs.meta.outputs.prerelease }}"
          echo "published ${{ needs.meta.outputs.tag }}"

      - name: What the dry run left on the draft
        if: needs.meta.outputs.mode == 'dry-run'
        run: |
          . scripts/release/gh.sh
          release_assets "$ID" | jq -r '.[] | "\(.size)\t\(.digest)\t\(.name)"'
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/octet-stream" \
            "$api_base/releases/assets/$(release_assets "$ID" | jq -r '.[] | select(.name == "latest.json") | .id')" | jq .

  cleanup:
    needs: [meta, release]
    if: ${{ always() && needs.meta.outputs.mode == 'dry-run' }}
    runs-on: linux-amd64
    steps:
      - uses: actions/checkout@v4
      - name: Delete the dry run's draft release
        run: |
          . scripts/release/gh.sh
          release_delete "${{ needs.meta.outputs.release }}"
          echo "deleted draft ${{ needs.meta.outputs.tag }}"
