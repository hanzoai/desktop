# Canonical caller — every knob lives in /hanzo.yml, none here, except which
# machine can run it.
#
# The reusable defaults to `linux-amd64` and no runner serving this repo
# advertises it while online: `evo-amd64` holds that label and the host is off
# the network, so every job queued until it was cancelled. `spark-arm64` is
# online at the org and serves `linux-arm64`. A `runs-on` value names a
# capability rather than a box, and typechecking and building a JavaScript
# workspace needs no particular architecture — the Tauri bundles are cut by
# `desktop-release.yml`, which names its own.
#
# Put this back to the default when evo is up.
name: CI/CD
on:
  push:
    branches: [main]
    # BOTH tag shapes. This repo's releases are tagged BARE (1.1.48, matching
    # package.json exactly — `release-prod.yml` triggered on the same pattern and
    # failed the release when they disagreed), so a `v*`-only filter meant the
    # tag=declared half of the version-drift gate could never once fire. `+` is
    # filter-pattern syntax, not a glob, and is the pattern that lane used.
    tags: ['v*', '[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v1
    secrets: inherit
    with:
      runner: '["linux-arm64"]'
