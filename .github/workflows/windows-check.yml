# The Windows half of the pull request gate: the whole hanzo-desktop crate, type-checked for
# x86_64-pc-windows-msvc. Nothing in CI runs on a Windows host and the release lane's Windows
# leg takes most of an hour, so a unix-only API (std::os::unix, a file mode) used outside a
# cfg(unix) would merge and only fail at the tag. `cargo xwin check` needs no linker and
# no bundler: the same toolchain as the release's Windows leg (scripts/release/cross-windows.sh)
# compiles the app and every dependency for Windows, and the sidecars and resources a bundle
# would carry are left out of the config for it.
name: windows-check

on:
  pull_request:
    paths:
      - apps/hanzo-desktop/src-tauri/**
      - scripts/release/**
      - .github/workflows/windows-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-check-${{ github.ref }}
  cancel-in-progress: true

env:
  KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
  KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}

jobs:
  windows:
    # src-tauri depends on private git repositories, fetched with a token from KMS: a fork's
    # pull request holds no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: heavy-linux-amd64
    timeout-minutes: 40
    env:
      XWIN_ARCH: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Cross toolchain
        run: scripts/release/cross-windows.sh
      - name: Toolchain and workspace
        run: scripts/release/prepare.sh x86_64-pc-windows-msvc
      - name: Check
        working-directory: apps/hanzo-desktop/src-tauri
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":[]}}'
        run: cargo xwin check --locked --target x86_64-pc-windows-msvc
