name: Release production

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

defaults:
  run:
    working-directory: ./

jobs:
  prebuild:
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 15
    outputs:
      version: ${{ steps.package-version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: get npm version
        id: package-version
        uses: Saionaro/extract-package-version@v1.2.1

      - name: Check version match
        if: ${{ github.ref_name != steps.package-version.outputs.version }}
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Version mismatch')

  release-hanzo-desktop:
    permissions:
      contents: 'write'
      id-token: 'write'
    needs: prebuild
    name: Release Hanzo Desktop (${{ matrix.id }})
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux-amd64 -> ARC scale set "hanzo-build-linux-amd64" (evo). ARC runners
          # match ONLY on the scale-set name, NOT the default [self-hosted,Linux,X64]
          # labels, so this must use the scale-set name (same pool prebuild uses).
          - id: linux-amd64
            arch: x86_64-unknown-linux-gnu
            os: hanzo-build-linux-amd64
            tauri_target: ''
            sidecar_archs: 'x86_64-unknown-linux-gnu'
            installer_glob: 'appimage/*.AppImage'
            updater_glob: 'appimage/*.AppImage.tar.gz'
            stable_name: hanzo-linux.AppImage
            stable_deb: hanzo-linux.deb

          # linux-arm64 -> ARC scale-set "hanzoai-arm64", running NATIVELY on spark.
          - id: linux-arm64
            arch: aarch64-unknown-linux-gnu
            os: hanzoai-arm64
            tauri_target: ''
            sidecar_archs: 'aarch64-unknown-linux-gnu'
            installer_glob: 'appimage/*.AppImage'
            updater_glob: 'appimage/*.AppImage.tar.gz'
            stable_name: hanzo-linux-arm64.AppImage
            stable_deb: hanzo-linux-arm64.deb

          # macos-universal -> ["self-hosted","macOS","ARM64"] (dbc). Cross-builds the
          # x86_64 slice on the arm64 host and lipos into ONE universal .dmg that runs
          # native on Apple Silicon AND Intel. Needs x86_64-apple-darwin sidecars too.
          - id: macos-universal
            arch: aarch64-apple-darwin
            os: [self-hosted, macOS, ARM64]
            tauri_target: 'universal-apple-darwin'
            sidecar_archs: 'aarch64-apple-darwin x86_64-apple-darwin'
            installer_glob: 'dmg/*.dmg'
            updater_glob: 'macos/*.app.tar.gz'
            stable_name: hanzo-macos.dmg
            stable_deb: ''

          # windows-amd64 -> ["self-hosted","Windows","X64"] (evo Windows VM).
          - id: windows-amd64
            arch: x86_64-pc-windows-msvc
            os: [self-hosted, Windows, X64]
            tauri_target: ''
            sidecar_archs: 'x86_64-pc-windows-msvc'
            installer_glob: 'nsis/*-setup.exe'
            updater_glob: 'nsis/*-setup.nsis.zip'
            stable_name: hanzo-windows.exe
            stable_deb: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    outputs:
      signature-x86_64-unknown-linux-gnu: ${{ steps.stage.outputs.signature-x86_64-unknown-linux-gnu }}
      update-url-x86_64-unknown-linux-gnu: ${{ steps.stage.outputs.update-url-x86_64-unknown-linux-gnu }}
      app-url-x86_64-unknown-linux-gnu: ${{ steps.stage.outputs.app-url-x86_64-unknown-linux-gnu }}
      signature-aarch64-unknown-linux-gnu: ${{ steps.stage.outputs.signature-aarch64-unknown-linux-gnu }}
      update-url-aarch64-unknown-linux-gnu: ${{ steps.stage.outputs.update-url-aarch64-unknown-linux-gnu }}
      app-url-aarch64-unknown-linux-gnu: ${{ steps.stage.outputs.app-url-aarch64-unknown-linux-gnu }}
      signature-aarch64-apple-darwin: ${{ steps.stage.outputs.signature-aarch64-apple-darwin }}
      update-url-aarch64-apple-darwin: ${{ steps.stage.outputs.update-url-aarch64-apple-darwin }}
      app-url-aarch64-apple-darwin: ${{ steps.stage.outputs.app-url-aarch64-apple-darwin }}
      signature-x86_64-pc-windows-msvc: ${{ steps.stage.outputs.signature-x86_64-pc-windows-msvc }}
      update-url-x86_64-pc-windows-msvc: ${{ steps.stage.outputs.update-url-x86_64-pc-windows-msvc }}
      app-url-x86_64-pc-windows-msvc: ${{ steps.stage.outputs.app-url-x86_64-pc-windows-msvc }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: (Windows) Install asiosdk
        if: ${{ matrix.arch == 'x86_64-pc-windows-msvc' }}
        shell: PowerShell
        run: |
          curl https://www.steinberg.net/asiosdk -o asiosdk.zip
          Expand-Archive .\asiosdk.zip -DestinationPath .\
          choco install asio4all
          choco install llvm

      # Workaround for NSIS bundle size limits https://nsis.sourceforge.io/Talk:Special_Builds
      - name: (Windows) Override NSIS by NSISBI
        if: ${{ matrix.arch == 'x86_64-pc-windows-msvc' }}
        shell: PowerShell
        run: |
          Invoke-WebRequest -Uri "https://sourceforge.net/projects/nsisbi/files/nsisbi3.10.3/nsis-binary-7423-3.zip/download" -MaximumRedirection 5 -OutFile "nsisbi.zip" -UserAgent "Wget"
          Expand-Archive .\nsisbi.zip -DestinationPath .\
          # Add tauri plugins
          Invoke-WebRequest -Uri "https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.1/nsis_tauri_utils.dll" -MaximumRedirection 5 -OutFile "nsis_tauri_utils.dll" -UserAgent "Wget"
          mkdir -p .\nsis-binary-7423-3\Plugins\x86-unicode\additional
          mv .\nsis_tauri_utils.dll .\nsis-binary-7423-3\Plugins\x86-unicode\additional\
          mkdir -p C:\Users\runneradmin\AppData\Local\tauri\NSIS
          mv .\nsis-binary-7423-3\* C:\Users\runneradmin\AppData\Local\tauri\NSIS\

      - name: (Linux) Install build dependencies
        if: ${{ contains(matrix.arch, 'linux') }}
        run: |
          # Wait out any competing apt/dpkg lock (unattended-upgrades, other
          # self-hosted jobs) instead of failing fast on a transient hold.
          for i in $(seq 1 60); do
            if ! sudo fuser /var/lib/apt/lists/lock /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock >/dev/null 2>&1; then
              break
            fi
            echo "waiting for apt/dpkg lock ($i)…"
            sleep 5
          done
          sudo apt-get update
          # Base tauri deps + the bundler toolchains the minimal ARC image lacks:
          #   .deb  -> xdg-utils (xdg-mime), fakeroot
          #   AppImage -> patchelf (linuxdeploy RPATH patching, the usual "failed to run
          #     linuxdeploy" cause), squashfs-tools (mksquashfs), desktop-file-utils,
          #     zsync, libfuse2 (paired with APPIMAGE_EXTRACT_AND_RUN=1 on the build step)
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libsoup-3.0-dev xdg-utils fakeroot patchelf libfuse2 squashfs-tools desktop-file-utils zsync

      - name: (MACOS) Install the Apple certificate and provisioning profile
        if: ${{ matrix.arch == 'aarch64-apple-darwin' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Cache cargo assets
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.arch }}-build-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          check-latest: false
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          # This repo is pnpm-native (pnpm-lock.yaml is the source of truth); npm ci
          # resolves @hanzo/ai's subpath exports differently and fails the vite build.
          # Pin pnpm 9.15.9 via npx so a newer system pnpm (which needs Node 22) is
          # never used against the setup-node Node 20 runtime.
          npx --yes pnpm@9.15.9 install --frozen-lockfile

      - name: (Unix) Ensure Rust toolchain on PATH
        if: ${{ matrix.arch != 'x86_64-pc-windows-msvc' }}
        shell: bash
        run: |
          # Self-hosted Linux/macOS runners have rustup under ~/.cargo/bin but not on
          # the non-interactive job PATH; export it. Install rustup as a fallback
          # only if cargo is genuinely absent.
          if [ -x "$HOME/.cargo/bin/cargo" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          elif ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: (macOS) Add universal Rust targets
        if: ${{ matrix.arch == 'aarch64-apple-darwin' }}
        shell: bash
        run: |
          # A universal .app lipos an arm64 + x86_64 slice; both Rust targets must exist.
          # PATH was exported by the previous step; call via ~/.cargo/bin as a belt-and-suspenders.
          RUSTUP="$(command -v rustup || echo "$HOME/.cargo/bin/rustup")"
          "$RUSTUP" target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Provide hanzo engine sibling (path-dep resolution stub)
        shell: bash
        run: |
          set -euo pipefail
          # The tauri crate declares OPTIONAL path deps on the sibling hanzoai/engine
          # workspace (hanzo, hanzo-engine, hanzo-server-core) behind the default-OFF
          # `native-engine` feature (default = ["machine"]). Release builds never enable
          # it, so cargo only READS those crates' manifests during resolution — it never
          # compiles them. Generate minimal stub crates (name + referenced features only)
          # so resolution succeeds on EVERY runner without cloning the private engine repo
          # or needing a PAT (which this repo does not have).
          ENGINE_DIR="$(dirname "$GITHUB_WORKSPACE")/engine"
          rm -rf "$ENGINE_DIR"
          for crate in hanzo hanzo-engine hanzo-server-core; do
            mkdir -p "$ENGINE_DIR/$crate/src"
            printf '[workspace]\n\n[package]\nname = "%s"\nversion = "0.1.0"\nedition = "2021"\n\n[features]\nmetal = []\ncuda = []\naccelerate = []\nflash-attn = []\n' "$crate" > "$ENGINE_DIR/$crate/Cargo.toml"
            : > "$ENGINE_DIR/$crate/src/lib.rs"
          done
          test -f "$ENGINE_DIR/hanzo/Cargo.toml"
          echo "engine stub crates ready at $ENGINE_DIR"

      - name: Setup cargo version from npm
        run: |
          cd ./apps/hanzo-desktop/src-tauri
          cargo install cargo-edit --force
          cargo set-version ${{ needs.prebuild.outputs.version }}

      - name: Download side binaries
        shell: bash
        env:
          HANZO_NODE_VERSION: v1.15.0
          OLLAMA_VERSION: v0.12.3
        run: |
          # macos-universal needs BOTH darwin slices; every other leg is single-arch.
          for a in ${{ matrix.sidecar_archs }}; do
            echo "::group::side-binaries $a"
            ARCH="$a" npx ts-node ./ci-scripts/download-side-binaries.ts
            echo "::endgroup::"
          done

      - name: (macOS) Lipo sidecars into universal binaries
        if: ${{ matrix.arch == 'aarch64-apple-darwin' }}
        shell: bash
        working-directory: apps/hanzo-desktop/src-tauri
        run: |
          set -euo pipefail
          # tauri build --target universal-apple-darwin expects each externalBin as a
          # single `<name>-universal-apple-darwin` FAT binary; it does not auto-lipo the
          # per-arch sidecars. Fuse the two arch slices we downloaded into one.
          mkuniv() {
            local base="$1"
            local a="${base}-aarch64-apple-darwin"
            local x="${base}-x86_64-apple-darwin"
            local u="${base}-universal-apple-darwin"
            if lipo -create "$a" "$x" -output "$u" 2>/dev/null; then
              :
            elif lipo "$a" -verify_arch x86_64 arm64 2>/dev/null; then
              cp "$a" "$u"   # aarch64 slice was already a fat binary
            elif lipo "$x" -verify_arch x86_64 arm64 2>/dev/null; then
              cp "$x" "$u"   # x86_64 slice was already a fat binary
            else
              cp "$a" "$u"   # single-arch fallback (bundling still succeeds)
            fi
            chmod +x "$u"
            echo "universal sidecar -> $u"
            lipo -info "$u" || true
          }
          mkuniv external-binaries/hanzo-node/hanzo-node
          mkuniv external-binaries/hanzo-node/hanzo-tools-runner-resources/deno
          mkuniv external-binaries/hanzo-node/hanzo-tools-runner-resources/uv

      - name: (Linux) Build hanzo-desktop
        if: ${{ contains(matrix.arch, 'linux') }}
        working-directory: apps/hanzo-desktop
        run: npx tauri build --verbose
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          VITE_POSTHOG_API_KEY: ${{ secrets.VITE_POSTHOG_API_KEY }}
          SECRET_DESKTOP_INSTALLATION_PROOF_KEY: ${{ secrets.SECRET_DESKTOP_INSTALLATION_PROOF_KEY }}
          NODE_OPTIONS: '--max_old_space_size=8192'
          # linuxdeploy (and the AppImage runtime) are themselves AppImages that need
          # FUSE to mount; ephemeral ARC runners have no FUSE, so run them in
          # extract-and-run mode instead — the canonical FUSE-less CI fix for
          # "failed to run linuxdeploy".
          APPIMAGE_EXTRACT_AND_RUN: '1'

      - name: (Macos) Build hanzo-desktop (universal)
        if: ${{ matrix.arch == 'aarch64-apple-darwin' }}
        working-directory: apps/hanzo-desktop
        run: npx tauri build --target universal-apple-darwin
        env:
          # Developer-ID CODE SIGNING stays on (APPLE_SIGNING_IDENTITY + cert). Apple
          # NOTARIZATION is intentionally NOT wired here: the team's Apple Developer
          # agreement is expired (notary API returns HTTP 403 "a required agreement is
          # missing or has expired"), which no secret can fix — the account holder must
          # re-sign it in App Store Connect. Setting APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID
          # would make tauri attempt notarization and fail the whole build. Once the
          # agreement is signed, re-add those three secrets to notarize.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          VITE_POSTHOG_API_KEY: ${{ secrets.VITE_POSTHOG_API_KEY }}
          SECRET_DESKTOP_INSTALLATION_PROOF_KEY: ${{ secrets.SECRET_DESKTOP_INSTALLATION_PROOF_KEY }}
          NODE_OPTIONS: '--max_old_space_size=8192'

      - name: (Windows) Build hanzo-desktop
        if: ${{ matrix.arch == 'x86_64-pc-windows-msvc' }}
        working-directory: apps/hanzo-desktop
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          VITE_POSTHOG_API_KEY: ${{ secrets.VITE_POSTHOG_API_KEY }}
          SECRET_DESKTOP_INSTALLATION_PROOF_KEY: ${{ secrets.SECRET_DESKTOP_INSTALLATION_PROOF_KEY }}
          # Windows Only
          CPAL_ASIO_DIR: ${{ github.workspace }}/asiosdk_2.3.3_2019-06-14
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          NODE_OPTIONS: '--max_old_space_size=8192'

      # Locate the produced installer + updater bundle by GLOB. productName is "Hanzo",
      # so exact filenames (Hanzo_<ver>_<arch>.dmg / _amd64.AppImage / _x64-setup.exe)
      # vary by platform/arch; globbing keeps this robust to tauri's naming.
      - name: Discover build artifacts
        id: artifacts
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          if [ -n "${{ matrix.tauri_target }}" ]; then
            BUNDLE="apps/hanzo-desktop/src-tauri/target/${{ matrix.tauri_target }}/release/bundle"
          else
            BUNDLE="apps/hanzo-desktop/src-tauri/target/release/bundle"
          fi
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"
          inst=("$BUNDLE"/${{ matrix.installer_glob }})
          if [ ${#inst[@]} -eq 0 ]; then
            echo "::error::No installer matched $BUNDLE/${{ matrix.installer_glob }}"
            ls -R "$BUNDLE" || true
            exit 1
          fi
          echo "installer=${inst[0]}" >> "$GITHUB_OUTPUT"
          echo "Discovered installer: ${inst[0]}"
          upd=("$BUNDLE"/${{ matrix.updater_glob }})
          echo "updater=${upd[0]:-}" >> "$GITHUB_OUTPUT"
          echo "Discovered updater bundle: ${upd[0]:-<none>}"
          sig=("$BUNDLE"/${{ matrix.updater_glob }}.sig)
          echo "updater_sig=${sig[0]:-}" >> "$GITHUB_OUTPUT"
          echo "Discovered updater signature: ${sig[0]:-<none>}"

      # --- Windows EV code signing (GCP KMS + jsign), on the discovered .exe ---
      - name: 'Google auth'
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        if: ${{ matrix.arch == 'x86_64-pc-windows-msvc' }}
        with:
          project_id: 'hanzo-ai'
          workload_identity_provider: 'projects/511721742630/locations/global/workloadIdentityPools/github/providers/hanzo-apps'
          service_account: 'github-ksm-ev-code-signing@hanzo-ai.iam.gserviceaccount.com'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
        if: ${{ matrix.arch == 'x86_64-pc-windows-msvc' }}
        with:
          project_id: 'hanzo-ai'

      - name: Set up Java
        uses: actions/setup-java@v4
        if: ${{ matrix.arch == 'x86_64-pc-windows-msvc' }}
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Download Jsign
        shell: bash
        if: ${{ matrix.arch == 'x86_64-pc-windows-msvc' }}
        run: choco install jsign

      - name: Cert to file
        shell: bash
        if: ${{ matrix.arch == 'x86_64-pc-windows-msvc' }}
        run: |
          echo -n "${{ secrets.EV_CODE_SIGNING_CERTIFICATE }}" > OS20241029372986.cer

      - name: Sign
        shell: bash
        if: ${{ matrix.arch == 'x86_64-pc-windows-msvc' }}
        run: >
          jsign \
              --storetype GOOGLECLOUD \
              --storepass "$(gcloud auth print-access-token)" \
              --keystore "projects/hanzo-ai/locations/us/keyRings/hanzo-apps" \
              --alias "EVCodeSigning/cryptoKeyVersions/1" \
              --certfile "OS20241029372986.cer" \
              --tsmode RFC3161 \
              --tsaurl http://timestamp.globalsign.com/tsa/r6advanced1 \
              "${{ steps.artifacts.outputs.installer }}"

      # Stage installers under BOTH a versioned name (Hanzo-<ver>-<id>.<ext>) and a
      # stable, unversioned alias (hanzo-<os>.<ext>) so hanzo.app can deep-link a URL
      # that never changes. dist-release -> versioned R2 path + GitHub Release.
      # dist-latest -> the public, overwrite-in-place R2 "latest/" prefix.
      - name: Stage release files
        id: stage
        shell: bash
        env:
          VERSION: ${{ needs.prebuild.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE="${{ steps.artifacts.outputs.bundle }}"
          ID="${{ matrix.id }}"
          installer="${{ steps.artifacts.outputs.installer }}"
          ext="${installer##*.}"
          mkdir -p dist-release dist-latest

          # primary installer: versioned + stable alias
          cp "$installer" "dist-release/Hanzo-${VERSION}-${ID}.${ext}"
          cp "$installer" "dist-release/${{ matrix.stable_name }}"
          cp "$installer" "dist-latest/${{ matrix.stable_name }}"

          # extra: Linux .deb
          if [ -n "${{ matrix.stable_deb }}" ]; then
            deb=$(ls $BUNDLE/deb/*.deb 2>/dev/null | head -n1 || true)
            if [ -n "$deb" ]; then
              cp "$deb" "dist-release/Hanzo-${VERSION}-${ID}.deb"
              cp "$deb" "dist-release/${{ matrix.stable_deb }}"
              cp "$deb" "dist-latest/${{ matrix.stable_deb }}"
            fi
          fi

          # extra: Windows .msi
          if [ "$ID" = "windows-amd64" ]; then
            msi=$(ls $BUNDLE/msi/*.msi 2>/dev/null | head -n1 || true)
            if [ -n "$msi" ]; then
              cp "$msi" "dist-release/Hanzo-${VERSION}-${ID}.msi"
              cp "$msi" "dist-release/hanzo-windows.msi"
              cp "$msi" "dist-latest/hanzo-windows.msi"
            fi
          fi

          # updater bundle + signature (feeds the auto-updater updates.json rollout)
          updater="${{ steps.artifacts.outputs.updater }}"
          updater_sig="${{ steps.artifacts.outputs.updater_sig }}"
          updater_name=""
          if [ -n "$updater" ]; then
            # keep the tauri-native suffix chain (.AppImage.tar.gz / .app.tar.gz / .nsis.zip)
            updater_name="Hanzo-${VERSION}-${ID}-$(basename "$updater")"
            cp "$updater" "dist-release/${updater_name}"
          fi
          if [ -n "$updater_sig" ]; then
            cp "$updater_sig" "dist-release/${updater_name}.sig"
            echo "signature-${{ matrix.arch }}=$(cat "$updater_sig")" >> "$GITHUB_OUTPUT"
          fi

          BASE="https://download.hanzo.ai/hanzo-desktop/binaries/production/${{ matrix.arch }}/${VERSION}.${{ github.run_number }}"
          echo "app-url-${{ matrix.arch }}=${BASE}/Hanzo-${VERSION}-${ID}.${ext}" >> "$GITHUB_OUTPUT"
          if [ -n "$updater_name" ]; then
            echo "update-url-${{ matrix.arch }}=${BASE}/${updater_name}" >> "$GITHUB_OUTPUT"
          fi

          echo "=== dist-release ===" && ls -la dist-release
          echo "=== dist-latest ===" && ls -la dist-latest

      # --- cosign signing for Linux artifacts (canonical, keyless GitHub OIDC) ---
      - name: (Linux) Install cosign
        if: ${{ contains(matrix.arch, 'linux') }}
        uses: sigstore/cosign-installer@v3

      - name: (Linux) Cosign-sign AppImage + signed checksums
        if: ${{ contains(matrix.arch, 'linux') }}
        shell: bash
        working-directory: dist-release
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          APPIMAGE="${{ matrix.stable_name }}"
          cosign sign-blob --yes \
            --output-signature "${APPIMAGE}.cosign.sig" \
            --output-certificate "${APPIMAGE}.cosign.pem" \
            "${APPIMAGE}"
          CHECKSUMS="checksums.txt"
          sha256sum * > "${CHECKSUMS}"
          cosign sign-blob --yes \
            --output-signature "${CHECKSUMS}.cosign.sig" \
            --output-certificate "${CHECKSUMS}.cosign.pem" \
            "${CHECKSUMS}"
          echo "Signed ${APPIMAGE} and ${CHECKSUMS} with cosign (keyless OIDC)."

      - name: Upload binaries to R2 (versioned)
        # R2 is the public CDN mirror; the GitHub Release below is the canonical
        # asset store. Don't let a bad/rotated R2 credential (currently
        # R2_ACCESS_KEY_ID is malformed) abort the job before the Release upload.
        continue-on-error: true
        uses: shallwefootball/s3-upload-action@master
        with:
          endpoint: https://54bf1bf573b3e6471e574cc4d318db64.r2.cloudflarestorage.com
          aws_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws_bucket: hanzo-download
          source_dir: dist-release
          destination_dir: ./hanzo-desktop/binaries/production/${{ matrix.arch }}/${{ needs.prebuild.outputs.version }}.${{ github.run_number }}/

      - name: Upload stable aliases to R2 (latest)
        continue-on-error: true
        uses: shallwefootball/s3-upload-action@master
        with:
          endpoint: https://54bf1bf573b3e6471e574cc4d318db64.r2.cloudflarestorage.com
          aws_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws_bucket: hanzo-download
          source_dir: dist-latest
          destination_dir: ./hanzo-desktop/latest/

      - name: Upload installers to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prebuild.outputs.version }}
        run: |
          set -uo pipefail
          REPO="$GITHUB_REPOSITORY"
          # Idempotent across the matrix legs: create the release once (published +
          # latest), or ensure an earlier partial/draft run is published + latest.
          if ! gh release view "$VERSION" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$VERSION" -R "$REPO" --title "$VERSION" \
              --notes "Hanzo Desktop $VERSION — all-platform native build." --latest || true
          fi
          gh release edit "$VERSION" -R "$REPO" --draft=false --latest || true
          # Upload each staged file with retries — the universal .dmg is large (~700MB)
          # and GitHub occasionally drops the connection ("other side closed"); softprops
          # does not retry, so drive gh release upload --clobber in a retry loop.
          rc=0
          for f in dist-release/*; do
            [ -f "$f" ] || continue
            ok=0
            for attempt in 1 2 3 4 5 6; do
              if gh release upload "$VERSION" "$f" -R "$REPO" --clobber; then
                echo "uploaded $(basename "$f")"; ok=1; break
              fi
              echo "::warning::GitHub upload retry $attempt for $(basename "$f")"
              sleep 20
            done
            [ $ok -eq 1 ] || { echo "::error::failed to upload $(basename "$f") after retries"; rc=1; }
          done
          exit $rc

  rollout-hanzo-desktop:
    environment: production
    needs:
      - prebuild
      - release-hanzo-desktop
    name: Generate & Update updates.json
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 20
    outputs:
      updates-next-json-url: ${{ steps.generate-updates-next-json.outputs.updates-next-json-url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          check-latest: false
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npx --yes pnpm@9.15.9 install --frozen-lockfile

      - name: Generate updates-next.json
        id: generate-updates-next-json
        env:
          JSON_PATH: files-to-r2/updates-next.json
          VERSION: ${{ needs.prebuild.outputs.version }}
          NOTES: Automatic update to ${{ needs.prebuild.outputs.version }}.${{ github.run_number }}
          LINUX_x86_64_SIGNATURE: ${{ needs.release-hanzo-desktop.outputs.signature-x86_64-unknown-linux-gnu }}
          LINUX_x86_64_URL: ${{ needs.release-hanzo-desktop.outputs.update-url-x86_64-unknown-linux-gnu }}
          LINUX_AARCH64_SIGNATURE: ${{ needs.release-hanzo-desktop.outputs.signature-aarch64-unknown-linux-gnu }}
          LINUX_AARCH64_URL: ${{ needs.release-hanzo-desktop.outputs.update-url-aarch64-unknown-linux-gnu }}
          DARWIN_AARCH64_SIGNATURE: ${{ needs.release-hanzo-desktop.outputs.signature-aarch64-apple-darwin }}
          DARWIN_AARCH64_URL: ${{ needs.release-hanzo-desktop.outputs.update-url-aarch64-apple-darwin }}
          WINDOWS_x86_64_SIGNATURE: ${{ needs.release-hanzo-desktop.outputs.signature-x86_64-pc-windows-msvc }}
          WINDOWS_x86_64_URL: ${{ needs.release-hanzo-desktop.outputs.update-url-x86_64-pc-windows-msvc }}
        run: |
          mkdir files-to-r2
          npx ts-node ./ci-scripts/generate-updates-json.ts
          echo "updates-next-json-url=https://download.hanzo.ai/hanzo-desktop/binaries/production/updates-next.json" >> "$GITHUB_OUTPUT"

      - name: Upload updates.json to R2
        continue-on-error: true
        uses: shallwefootball/s3-upload-action@master
        with:
          endpoint: https://54bf1bf573b3e6471e574cc4d318db64.r2.cloudflarestorage.com
          aws_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws_bucket: hanzo-download
          source_dir: files-to-r2
          destination_dir: ./hanzo-desktop/binaries/production/

  notify-slack:
    environment: production
    needs:
      - prebuild
      - release-hanzo-desktop
      - rollout-hanzo-desktop
    name: Notify Slack
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 15
    steps:
      - name: Post Hanzo Desktop to a Slack channel
        id: slack
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: 'C072VJ6E7GC'
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "📦 New build: Hanzo Desktop v${{ needs.prebuild.outputs.version }}.${{ github.run_number }}",
                    "emoji": true
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Download it from:\n* <${{ needs.release-hanzo-desktop.outputs.app-url-aarch64-apple-darwin }}|macOS (Universal)>\n* <${{ needs.release-hanzo-desktop.outputs.app-url-x86_64-pc-windows-msvc }}|Windows (x86_64)>\n* <${{ needs.release-hanzo-desktop.outputs.app-url-x86_64-unknown-linux-gnu }}|Linux (x86_64)>"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "_💡 Rename file <${{ needs.rollout-hanzo-desktop.outputs.updates-next-json-url }}|updates-next.json> to updates.json to start the rollout through the auto updater_"
                    }
                  ]
                }
              ]
            }
